# ─── Application ──────────────────────────────────────────────
spring.application.name=bedrock-ai

# ─── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ─── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Redis (Upstash — TLS required) ──────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ─── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=7d
app.frontend-url=http://localhost:3000

# ─── Gemini API ───────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:${AI_API_KEY}}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ─── OAuth2 (optional — set GOOGLE_CLIENT_ID/SECRET in .env to enable) ──
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
