#  Application 
spring.application.name=bedrock-ai

# Database 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis (Upstash — TLS required) 
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# JWT 
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=7d
app.frontend-url=http://localhost:3000

# Gemini API 
gemini.api.key=${GEMINI_API_KEY:${AI_API_KEY}}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Resilience4j Gemini API 
resilience4j.retry.instances.ai.max-attempts=3
resilience4j.retry.instances.ai.wait-duration=2s
resilience4j.retry.instances.ai.enable-exponential-backoff=true
resilience4j.retry.instances.ai.exponential-backoff-multiplier=2
resilience4j.retry.instances.ai.retry-exceptions=java.io.IOException,org.springframework.web.reactive.function.client.WebClientRequestException,java.util.concurrent.TimeoutException

resilience4j.circuitbreaker.instances.ai.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.ai.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ai.permitted-number-of-calls-in-half-open-state=3

resilience4j.timelimiter.instances.ai.timeout-duration=45s

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
