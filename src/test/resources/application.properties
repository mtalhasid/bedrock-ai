# ─── Test overrides ───────────────────────────────────────────
# Exclude Redis autoconfiguration (not available in unit/integration tests)
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

# ─── H2 In-Memory Database (PostgreSQL compatibility mode) ────
spring.datasource.url=jdbc:h2:mem:bedrockai-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop

# ─── JWT ──────────────────────────────────────────────────────
jwt.secret=bedrock-ai-test-jwt-secret-key-min-32-chars
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
